<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Zone - Admin Panel (No Password)</title>

<!-- Firebase CDNs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
    :root {
        --bg: #0b0d13;
        --card: rgba(20, 24, 36, 0.9);
        --border: rgba(255, 204, 0, 0.18);
        --accent: #ffcc00;
        --accent2: #ff6600;
        --text: #ffffff;
        --dim: #8fa0b3;
        --green: #43a047;
        --red: #e53935;
    }
    * { box-sizing: border-box; margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; }

    #dashboard-screen { max-width: 1100px; margin: 0 auto; }
    .dash-header {
        display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
        padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px;
    }
    .dash-header h1 { font-size: 1rem; color: var(--accent); }
    .dash-header .admin-email { font-size: 0.7rem; color: var(--dim); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
    .stat-card .val { font-size: 1.3rem; font-weight: 900; color: var(--accent); }
    .stat-card .lbl { font-size: 0.65rem; color: var(--dim); margin-top: 2px; }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
    th { color: var(--dim); font-size: 0.68rem; text-transform: uppercase; }
    .table-wrap { overflow-x: auto; }
    
    .btn-remove { background: var(--red); border: none; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.68rem; cursor: pointer; transition: 0.3s; }
    .btn-remove:hover { background: #b71c1c; }
    
    .note-box { font-size: 0.68rem; color: var(--dim); background: rgba(255,204,0,0.06); border: 1px dashed var(--border); padding: 8px; border-radius: 8px; margin-bottom: 14px; }
</style>
</head>
<body>

<div id="dashboard-screen">
    <div class="dash-header">
        <div>
            <h1>👑 Gaming Zone Admin (Direct Access)</h1>
            <div class="admin-email">Password login completely removed</div>
        </div>
    </div>

    <div class="stats-grid" id="stats-grid"></div>

    <div class="panel" id="users-panel">
        <div class="note-box">এখানে রিয়েলটাইম ডাটাবেজ থেকে ইউজারদের তালিকা দেখা যাচ্ছে এবং সরাসরি রিমুভ করা যাবে।</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>UID</th>
                        <th>Balance</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAyTOnCm5IuPcB-yvGjFl3KbwRVxNrcNSY",
        authDomain: "ff-to-gaming-4ea1b.firebaseapp.com",
        databaseURL: "https://ff-to-gaming-4ea1b-default-rtdb.firebaseio.com",
        projectId: "ff-to-gaming-4ea1b",
        storageBucket: "ff-to-gaming-4ea1b.appspot.com",
        messagingSenderId: "816776130875",
        appId: "1:816776130875:web:c3e7984e0de53cbd89871e"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // সরাসরি ডাটাবেজ থেকে ইউজার লোড করা এবং রিমুভ করার ব্যবস্থা
    function loadUsers() {
        db.ref('users').on('value', function(snapshot) {
            const data = snapshot.val() || {};
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';

            let totalUsers = 0, totalBalance = 0;

            Object.keys(data).forEach(uid => {
                const u = data[uid];
                totalUsers++;
                totalBalance += (u.balance || 0);

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${u.email || '-'}</td>
                    <td style="font-size:0.6rem;color:#8fa0b3;">${uid}</td>
                    <td>🪙 ${(u.balance || 0).toFixed(2)}</td>
                    <td><button class="btn-remove" onclick="removeUser('${uid}')"><i class="fa-solid fa-trash"></i> Remove User</button></td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('stats-grid').innerHTML = `
                <div class="stat-card"><div class="val">${totalUsers}</div><div class="lbl">Total Users</div></div>
                <div class="stat-card"><div class="val">🪙${totalBalance.toFixed(0)}</div><div class="lbl">Total Balance</div></div>
            `;
        });
    }

    // নির্দিষ্ট ইউজারকে ডাটাবেজ থেকে মুছে ফেলার ফাংশন
    function removeUser(uid) {
        if (confirm('Are you sure you want to remove this user from database?')) {
            db.ref('users/' + uid).remove().then(() => {
                alert('User removed successfully!');
            }).catch(err => {
                alert('Failed to remove: ' + err.message);
            });
        }
    }

    // পেজ লোড হলেই ইউজার লিস্ট চলে আসবে
    window.onload = loadUsers;
</script>
</body>
</html>
