<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন প্যানেল - রিকোয়েস্ট ম্যানেজমেন্ট</title>
    <!-- ফায়ারবেস SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #ffffff; padding: 20px; }
        h2 { color: #ffcc00; margin-bottom: 15px; border-bottom: 2px solid #ffcc00; padding-bottom: 5px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .card-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .request-item { background: #21262d; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #ffcc00; }
        .request-item p { margin-bottom: 6px; font-size: 14px; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-approve { background: #238636; }
        .btn-approve:hover { background: #2ea043; }
        .btn-reject { background: #da3633; }
        .btn-reject:hover { background: #f85149; }
        .highlight { color: #58a6ff; }
        .trx { color: #ffcc00; }
        .empty-msg { color: #8b949e; font-style: italic; }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 25px; color: #58a6ff;">ডিপোজিট ও উইথড্র এডমিন প্যানেল</h1>

    <div class="container">
        <!-- ডিপোজিট সেকশন -->
        <div class="card-box">
            <h2>ডিপোজিট রিকোয়েস্ট (Pending)</h2>
            <div id="admin-deposits-list">
                <p class="empty-msg">লোড হচ্ছে...</p>
            </div>
        </div>

        <!-- উইথড্র সেকশন -->
        <div class="card-box">
            <h2>উইথড্র রিকোয়েস্ট (Pending)</h2>
            <div id="admin-withdrawals-list">
                <p class="empty-msg">লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <script>
        // --- ফায়ারবেস কনফিগারেশন (আপনার প্রজেক্টের ইনফো এখানে দিন) ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // ফায়ারবেস ইনিশিয়ালাইজ
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- ডিপোজিট লোড করা ---
        function loadAdminDeposits() {
            db.ref('adminRequests/deposits').orderByChild('status').equalTo('pending').on('value', snapshot => {
                const container = document.getElementById('admin-deposits-list');
                container.innerHTML = '';
                const data = snapshot.val();
                
                if (!data) {
                    container.innerHTML = '<p class="empty-msg">কোনো পেন্ডিং ডিপোজিট নেই।</p>';
                    return;
                }

                Object.keys(data).forEach(id => {
                    const req = data[id];
                    const div = document.createElement('div');
                    div.className = 'request-item';
                    
                    div.innerHTML = `
                        <p><b>ইউজার আইডি:</b> <span class="highlight">${req.userId || req.email}</span></p>
                        <p><b>মেথড:</b> ${req.method.toUpperCase()} | <b>পরিমাণ:</b> <span style="color:#3fb950;">${req.amount}</span></p>
                        <p><b>TrxID:</b> <span class="trx">${req.trxId}</span></p>
                        <div class="btn-group">
                            <button class="btn-approve" onclick="processDeposit('${id}', 'approved', '${req.userId}', ${req.amount})">Approve</button>
                            <button class="btn-reject" onclick="processDeposit('${id}', 'rejected', '${req.userId}', ${req.amount})">Reject</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        // --- উইথড্র লোড করা ---
        function loadAdminWithdrawals() {
            db.ref('adminRequests/withdrawals').orderByChild('status').equalTo('pending').on('value', snapshot => {
                const container = document.getElementById('admin-withdrawals-list');
                container.innerHTML = '';
                const data = snapshot.val();
                
                if (!data) {
                    container.innerHTML = '<p class="empty-msg">কোনো পেন্ডিং উইথড্র নেই।</p>';
                    return;
                }

                Object.keys(data).forEach(id => {
                    const req = data[id];
                    const div = document.createElement('div');
                    div.className = 'request-item';
                    div.style.borderLeftColor = '#f85149';
                    
                    div.innerHTML = `
                        <p><b>ইউজার আইডি:</b> <span class="highlight">${req.userId || req.email}</span></p>
                        <p><b>মেথড:</b> ${req.method.toUpperCase()} | <b>পরিমাণ:</b> <span style="color:#f85149;">${req.amount}</span></p>
                        <p><b>একাউন্ট নম্বর:</b> <span class="trx">${req.accountNo}</span></p>
                        <div class="btn-group">
                            <button class="btn-approve" onclick="processWithdrawal('${id}', 'approved', '${req.userId}', ${req.amount})">Approve</button>
                            <button class="btn-reject" onclick="processWithdrawal('${id}', 'rejected', '${req.userId}', ${req.amount})">Reject</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        // --- ডিপোজিট প্রসেস (অ্যাপ্রুভ করলে ইউজারের ব্যালেন্স যোগ হতে পারে) ---
        function processDeposit(requestId, status, userId, amount) {
            if (!confirm(`আপনি কি রিকোয়েস্টটি ${status === 'approved' ? 'অ্যাপ্রুভ' : 'রিজেক্ট'} করতে চান?`)) return;

            // রিকোয়েস্ট স্ট্যাটাস আপডেট
            db.ref(`adminRequests/deposits/${requestId}`).update({ status: status }).then(() => {
                if (status === 'approved' && userId) {
                    // ইউজারের ব্যালেন্স আপডেট লজিক (আপনার ডাটাবেজ স্ট্রাকচার অনুযায়ী পাথ পরিবর্তন করতে পারেন)
                    const userRef = db.ref(`users/${userId}/balance`);
                    userRef.transaction(currentBalance => {
                        return (currentBalance || 0) + amount;
                    });
                }
                alert('সফলভাবে আপডেট করা হয়েছে!');
            }).catch(error => {
                alert('ত্রুটি: ' + error.message);
            });
        }

        // --- উইথড্র প্রসেস ---
        function processWithdrawal(requestId, status, userId, amount) {
            if (!confirm(`আপনি কি উইথড্র রিকোয়েস্টটি ${status === 'approved' ? 'অ্যাপ্রুভ' : 'রিজেক্ট'} করতে চান?`)) return;

            db.ref(`adminRequests/withdrawals/${requestId}`).update({ status: status }).then(() => {
                // যদি উইথড্র রিজেক্ট হয়, তবে সাধারণত ইউজারের কেটে নেওয়া ব্যালেন্স ফেরত দেওয়া হয়
                if (status === 'rejected' && userId) {
                    const userRef = db.ref(`users/${userId}/balance`);
                    userRef.transaction(currentBalance => {
                        return (currentBalance || 0) + amount;
                    });
                }
                alert('সফলভাবে আপডেট করা হয়েছে!');
            }).catch(error => {
                alert('ত্রুটি: ' + error.message);
            });
        }

        // পেজ লোড হলে ফাংশনগুলো রান হবে
        window.onload = function() {
            loadAdminDeposits();
            loadAdminWithdrawals();
        };
    </script>
</body>
</html>
